name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      verify_tag:
        description: 'Existing release tag to verify without republishing'
        required: true
        default: 'v0.3.0'
        type: string

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Test npm publishing scripts
        run: node --test scripts/publish-npm.test.mjs scripts/verify-npm-oidc.test.mjs

      - name: Verify npm OIDC publishing identity
        run: node scripts/verify-npm-oidc.mjs @yone_k/zaim-cli

      - name: Run GoReleaser
        if: github.event_name == 'push'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish npm packages
        if: github.event_name == 'push'
        run: bash scripts/publish-npm.sh "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Verify existing npm release
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.verify_tag }}
        run: |
          version="${RELEASE_TAG#v}"
          npm view "@yone_k/zaim-cli@${version}" version bin --json
          npm exec --yes --package="@yone_k/zaim-cli@${version}" -- zaim-cli --version
