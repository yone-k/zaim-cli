name: Test

on:
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test npm publishing scripts
        run: node --test scripts/publish-npm.test.mjs scripts/verify-npm-oidc.test.mjs
